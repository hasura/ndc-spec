[workspace]
resolver = "2"

package.version = "0.2.14"
package.edition = "2021"

members = ["ndc-models", "ndc-reference", "ndc-test"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# unstable warnings; we might need to suppress them
redundant_clone = "warn"
# disable certain pedantic warnings
doc_markdown = { level = "allow" }
missing_errors_doc = { level = "allow" }
missing_panics_doc = { level = "allow" }
module_name_repetitions = { level = "allow" }
must_use_candidate = { level = "allow" }
return_self_not_must_use = { level = "allow" }
too_many_lines = { level = "allow" }
wildcard_imports = { level = "allow" }

[workspace.dependencies]
arbitrary = { version = "1", features = ["derive"] }
async-trait = "0.1"
axum = "0.8"
clap = "4"
colorful = "0.3"
goldenfile = "1"
indexmap = "2"
insta = { version = "1", features = ["glob", "json"] }
iso8601 = "0.6"
itertools = "0.15"
prometheus = "0.14"
rand = "0.10"
ref-cast = "1.0"
regex = "1"
reqwest = { version = "0.13", default-features = false }
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_with = "3"
smol_str = "0.3"
thiserror = "2"
tokio = "1"
tokio-test = "0.4"
url = "2"
